
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Project तर्क</title>
      <meta name="description" content="Project तर्क is a thinking platform designed to help people map consequences, systems, decisions, and speculative possibilities across multiple layers of reality.

This platform includes a growing toolkit of frameworks, exercises, prompts, and interactive activities designed to support workshops, learning environments, research processes, and long-term thinking practices." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <!-- GitHub Pages SPA: restore path from 404.html redirect -->
      <script>
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) {
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location))
      </script>

      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
